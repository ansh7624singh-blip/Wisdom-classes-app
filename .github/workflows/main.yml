name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        cache-dependency-path: |
          WisdomClasses_Android_Project/**/*.gradle*
          WisdomClasses_Android_Project/**/gradle-wrapper.properties

    - name: Grant execute permission for gradlew
      working-directory: WisdomClasses_Android_Project
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: WisdomClasses_Android_Project
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: WisdomClasses_Android_Project/app/build/outputs/apk/debug/app-debug.apk 
